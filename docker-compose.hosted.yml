# Simulates the "hosted backend" half of the local sandbox agent architecture
# (obsidian_memory/08.4's Phase 1 / 03.6's bridging protocol) as its own,
# separate container group — api + agent-gateway + LocalStack, no SSH target
# containers, and no shared network with those.
#
# LocalStack belongs here, not with the SSH targets: it's a cloud-API mock the
# Runner calls directly over the network, exactly like real AWS would be — it
# has nothing to do with the Agent/tunnel bridging, which is specifically
# about reaching Ansible/SSH targets the Runner can't dial directly. Only the
# SSH targets (the user's simulated "local machine") live in the separate
# stack below.
#
# The "local machine" half is intentionally a *separate* Compose project:
# sandbox/docker-compose.sandbox.yml (driven by `whiparc sandbox up`),
# reachable only through this stack's published ports (8080/9090), never by
# container DNS name — that separation is the actual thing being tested here.
#
# Usage:
#   docker compose -f docker-compose.hosted.yml up --build
#   (then, in a separate terminal / separate machine once cross-host testing
#   is set up) whiparc sandbox up --project <id>
#
# Set GATEWAY_RUNNER_SECRET in a .env file alongside this compose file (or
# your shell environment) to override the default dev-only secret below —
# it must match on both services, which the shared variable here guarantees.
#
# Database: this stack always runs on Postgres — a bundled, disposable
# `postgres` service, not SQLite. Unlike docker-compose.yml (the contributor
# stack, which stays on zero-dependency SQLite by design — see
# obsidian_memory/09.2), this file exists specifically to reproduce the
# hosted deployment's shape, and the hosted deployment runs on Postgres
# (Supabase). DATABASE_URL defaults to the bundled `postgres` service below;
# set DATABASE_URL in a .env file alongside this compose file to point at a
# real (e.g. scratch Supabase) instance instead when you deliberately need
# to test against one — the bundled container is for everyday local use.
#
# Explicit project name: without this, Compose derives the project name from
# the directory (same as docker-compose.yml's default), which makes it treat
# this file's "api" service as the SAME logical service as the main stack's —
# and replaces whichever one is already running. Keeping this on its own
# project namespace lets both stacks run side by side safely.
name: whiparc-hosted

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Same image name/tag as docker-compose.yml's api service — same
    # Dockerfile and context, so whichever stack you build first, the other
    # reuses that image instead of rebuilding it. Also a real, pullable GHCR
    # reference (see publish-api-image.yml) — `docker compose up -d` with no
    # `--build` on a fresh VM now pulls a real published image instead of
    # failing with "pull access denied for whiparc/api, repository does not
    # exist", which is what the bare local tag `whiparc/api:dev` used to do.
    # Defaults to `stable` (the most recently tagged vX.Y.Z release) — what
    # a real Hetzner deploy should run; set API_IMAGE_TAG=dev/main in .env
    # to track a branch instead.
    image: ghcr.io/whiparc/whiparc/api:${API_IMAGE_TAG:-stable}
    container_name: whiparc-api-hosted
    ports:
      - "8080:8080"
    env_file:
      # Everything production-only (WHIPARC_MASTER_KEY, JWT_SECRET,
      # FRONTEND_URL, OAuth client IDs/secrets, and an override DATABASE_URL
      # if you want one — see .env.example) flows through here from a .env
      # file placed alongside this compose file on the VM. DB_DRIVER is
      # fixed to postgres below, not sourced from .env — this stack has no
      # SQLite mode to fall back to.
      - path: .env
        required: false
    environment:
      - PORT=8080
      - IS_DOCKER=true
      - VERBOSE=true
      - SANDBOX_AGENT_BETA=true
      - GATEWAY_URL=http://agent-gateway:9090
      - GATEWAY_RUNNER_SECRET=${GATEWAY_RUNNER_SECRET:-hosted-dev-secret}
      - whiparc_GATEWAY_SECRET=${GATEWAY_RUNNER_SECRET:-hosted-dev-secret}
      - DB_DRIVER=postgres
      # ${DATABASE_URL:-...} rather than a plain env_file passthrough: a
      # DATABASE_URL set in .env (e.g. a real scratch Supabase project) wins;
      # otherwise this falls back to the bundled `postgres` service below,
      # reached by its container DNS name, not localhost.
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/whiparc_hosted?sslmode=disable}
    volumes:
      # Still needed with Postgres as the DB — apps/api/runner/runner.go
      # writes each deploy's live Terraform/Ansible workspace under
      # /app/data/workspace/current regardless of DB backend. No longer
      # holds a SQLite file in this stack, hence the rename from the old
      # hosted-api-db-data.
      - hosted-api-workspace:/app/data
      # Read-only: the api container only ever *reads* the shared sandbox
      # public key (readSandboxPublicKey in main.go) as a fallback for
      # LocalStack runs with no project SSH credential configured. Writing a
      # fresh per-installation key here is `whiparc sandbox up`'s job,
      # on the separate "local machine" stack, never this container. Missing
      # this mount (as this file originally did) makes that fallback fail
      # silently, and Terraform falls back to bundleGenerator.ts's invalid
      # placeholder key instead — the exact "InvalidKeyPair.Format" bug this
      # mount fixes.
      - ./sandbox:/app/sandbox:ro
    depends_on:
      agent-gateway:
        condition: service_started
      localstack:
        condition: service_started
      postgres:
        condition: service_healthy

  agent-gateway:
    # Built and published by whiparc/cloud's publish-agent-gateway.yml workflow
    # (apps/agent-gateway was extracted there with full history preserved via
    # `git subtree`, and now lives at github.com/whiparc/cloud/agent-gateway).
    # Requires `docker login ghcr.io` with read:packages on the whiparc org,
    # since whiparc/cloud is a private repo. Defaults to `stable` (the most
    # recently `vX.Y.Z`-tagged release, matching the api service's default
    # above) — cutting a release means pushing the same `vX.Y.Z` tag to both
    # whiparc/whiparc and whiparc/cloud, since there's no automated
    # cross-repo trigger. Set AGENT_GATEWAY_IMAGE_TAG=latest in .env to track
    # whiparc/cloud's main branch instead.
    image: ghcr.io/whiparc/cloud/agent-gateway:${AGENT_GATEWAY_IMAGE_TAG:-stable}
    container_name: whiparc-agent-gateway-hosted
    ports:
      - "9090:9090"
    command:
      - "--listen=:9090"
      - "--api-url=http://api:8080"
      - "--runner-secret=${GATEWAY_RUNNER_SECRET:-hosted-dev-secret}"

  localstack:
    container_name: infra-localstack-hosted
    image: localstack/localstack:3.4.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=ec2,s3
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

  # Disposable local stand-in for the hosted deployment's Supabase Postgres —
  # same image/config as .github/workflows/ci.yml's test service, so "test
  # locally the same way CI does" is literally true, not just similar. Not
  # published to the host by default (api reaches it as `postgres:5432` over
  # the compose network); uncomment the `ports:` line below only if you want
  # to `psql` in from outside Docker, and pick a non-5432 host port if you
  # do, in case something else on the host already owns 5432.
  postgres:
    container_name: whiparc-postgres-hosted
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=whiparc_hosted
    # ports:
    #   - "55432:5432"
    volumes:
      - hosted-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # A freshly-pulled postgres:16-alpine's initdb can sit at "performing
      # post-bootstrap initialization ... ok" for several minutes with
      # near-zero CPU on Windows/Docker Desktop specifically (see
      # obsidian_memory/07.2 entry 21) — confirmed while building this file
      # (took ~4 minutes on this machine). retries is generous enough to
      # cover that; it doesn't mean a healthy startup is ever actually slow.
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  hosted-api-workspace:
  hosted-postgres-data:
