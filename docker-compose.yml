services:
  api:
    build:
      # Repo root (not ./apps/api) so the build can also reach apps/cli — the
      # image needs the whiparc CLI binary on PATH for the local_agent
      # SSH ProxyCommand bridge (see obsidian_memory/08.4's Phase 1).
      context: .
      dockerfile: apps/api/Dockerfile
    # Explicit (rather than Compose's default per-project name) so this
    # matches docker-compose.hosted.yml's api image — building one stack
    # then the other reuses the same image/cache instead of rebuilding it.
    # Also a real, pullable GHCR reference (see publish-api-image.yml) —
    # `docker compose up` without `--build` now pulls a real published image
    # instead of failing with "pull access denied for whiparc/api", which
    # is what the bare local tag `whiparc/api:dev` used to do. Defaults to
    # `stable` (the most recently tagged vX.Y.Z release) so a first-time
    # contributor gets a known-good image with zero setup; override with
    # API_IMAGE_TAG=dev in .env to track the bleeding edge instead.
    image: ghcr.io/whiparc/whiparc/api:${API_IMAGE_TAG:-stable}
    container_name: whiparc-api
    ports:
      - "8080:8080"
    env_file:
      # OAuth Client ID/Secret and friends — see .env.example. Optional so
      # `docker compose up` still works before you've created one; social
      # login endpoints just report "not configured" until you do.
      - path: .env
        required: false
    environment:
      - PORT=8080
      - IS_DOCKER=true
      - VERBOSE=true
    volumes:
      - ./sandbox:/app/sandbox
      - api-db-data:/app/data
    depends_on:
      - localstack
      - ubuntu_ssh_1
      - ubuntu_ssh_2

  localstack:
    container_name: whiparc-localstack
    image: localstack/localstack:3.4.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=ec2,s3
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

  # ubuntu_ssh_1 and ubuntu_ssh_2 build the identical Dockerfile/context, so
  # they share one `image:` name — Compose builds it once and reuses it for
  # both containers instead of building the same image twice.
  # Also a real, pullable GHCR reference now (see
  # publish-sandbox-ssh-image.yml), same reasoning and default as the api
  # service above — override with SANDBOX_IMAGE_TAG=dev in .env if needed.
  ubuntu_ssh_1:
    container_name: whiparc-ubuntu_ssh_1
    image: ghcr.io/whiparc/whiparc/sandbox-ssh:${SANDBOX_IMAGE_TAG:-stable}
    build:
      context: ./sandbox
      dockerfile: Dockerfile.ssh
    ports:
      - "2222:22"

  ubuntu_ssh_2:
    container_name: whiparc-ubuntu_ssh_2
    image: ghcr.io/whiparc/whiparc/sandbox-ssh:${SANDBOX_IMAGE_TAG:-stable}
    build:
      context: ./sandbox
      dockerfile: Dockerfile.ssh
    ports:
      - "2223:22"

volumes:
  api-db-data:
