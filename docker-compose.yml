services:
  api:
    build:
      # Repo root (not ./apps/api) so the build can also reach apps/cli — the
      # image needs the whiparc CLI binary on PATH for the local_agent
      # SSH ProxyCommand bridge (see obsidian_memory/08.4's Phase 1).
      context: .
      dockerfile: apps/api/Dockerfile
    # Explicit (rather than Compose's default per-project name) so this
    # matches docker-compose.hosted.yml's api image — building one stack
    # then the other reuses the same image/cache instead of rebuilding it.
    image: whiparc/api:dev
    container_name: whiparc-api
    ports:
      - "8080:8080"
    env_file:
      # OAuth Client ID/Secret and friends — see .env.example. Optional so
      # `docker compose up` still works before you've created one; social
      # login endpoints just report "not configured" until you do.
      - path: .env
        required: false
    environment:
      - PORT=8080
      - IS_DOCKER=true
      - VERBOSE=true
    volumes:
      - ./sandbox:/app/sandbox
      - api-db-data:/app/data
    depends_on:
      - localstack
      - ubuntu_ssh_1
      - ubuntu_ssh_2

  localstack:
    container_name: whiparc-localstack
    image: localstack/localstack:3.4.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=ec2,s3
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

  # ubuntu_ssh_1 and ubuntu_ssh_2 build the identical Dockerfile/context, so
  # they share one `image:` name — Compose builds it once and reuses it for
  # both containers instead of building the same image twice.
  ubuntu_ssh_1:
    container_name: whiparc-ubuntu_ssh_1
    image: whiparc/sandbox-ssh:dev
    build:
      context: ./sandbox
      dockerfile: Dockerfile.ssh
    ports:
      - "2222:22"

  ubuntu_ssh_2:
    container_name: whiparc-ubuntu_ssh_2
    image: whiparc/sandbox-ssh:dev
    build:
      context: ./sandbox
      dockerfile: Dockerfile.ssh
    ports:
      - "2223:22"

volumes:
  api-db-data:
