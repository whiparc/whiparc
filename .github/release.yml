# Categories for GitHub's auto-generated release notes.
changelog:
  exclude:
    labels:
      - dependencies
  categories:
    - title: Breaking changes
      labels:
        - breaking
    - title: Features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Security
      labels:
        - security
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
