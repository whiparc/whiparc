name: Bug report
description: Something isn't working as expected.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please don't use this for security
        vulnerabilities — see [SECURITY.md](../../SECURITY.md) instead.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - apps/web (canvas UI)
        - apps/api (backend/runner)
        - apps/cli
        - sandbox (local dev environment)
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: CLI version (`infracanvas --version`) or git commit SHA
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, browser (for apps/web), Go version, Node version, Docker version, etc.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      render: shell
    validations:
      required: false
