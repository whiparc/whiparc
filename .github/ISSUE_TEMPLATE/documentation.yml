name: Documentation
description: Something in the docs is missing, unclear or wrong.
title: "[Docs]: "
labels: ["documentation", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the docs. Small fixes are welcome as a
        pull request directly; no issue is needed first.
  - type: input
    id: location
    attributes:
      label: Where is the problem?
      description: A file path, heading, or URL (for example `docs/DEVELOPMENT.md`, or a page under /docs on whiparc.com).
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is missing, unclear or wrong?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: Optional. What should it say instead?
    validations:
      required: false
